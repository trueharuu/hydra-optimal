[package]
name = "zxcl-optimal-solver"
version = "0.4.20240203"
edition = "2021"
license = "GPL-3.0-only"
description = "Standalone zxcl perfect-clear decision-tree solver with optional V* scoring"
publish = false

[dependencies]
anyhow = "1.0"
dashmap = "6.2.1"
hashbrown = "0.14"
libc = "0.2"
memmap2 = "0.9"
rayon = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
